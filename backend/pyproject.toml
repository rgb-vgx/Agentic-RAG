[project]
name = "agentic-rag-backend"
version = "0.1.0"
description = "Agentic RAG — Adaptive Document Intelligence & Question Answering System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sse-starlette>=2.1.0",
    # Agent workflow
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    # LLM / embedding providers
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    # Data layer
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Vector store
    "qdrant-client>=1.12.0",
    # Job queue
    "redis>=5.1.0",
    "rq>=1.16.0",
    # Object storage
    "boto3>=1.35.0",
    # Document parsing
    "pymupdf>=1.24.0",
    "tiktoken>=0.7.0",
    # Observability
    "langfuse>=2.50.0",
    "structlog>=24.4.0",
    # Auth
    "pyjwt>=2.9.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    # Encrypt per-user integration credentials at rest.
    "cryptography>=50.0.0",
    # Required by FastAPI for UploadFile/multipart endpoints
    "python-multipart>=0.0.9",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# Layout-aware PDF parser for scientific/technical documents. Large
# (torch + layout/table/formula models); not needed for the legal pipeline.
docling = ["docling>=2.149.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "fakeredis>=2.26.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
