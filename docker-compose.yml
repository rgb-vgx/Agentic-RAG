# Agentic RAG — full local stack (Section 16.4)
#   docker compose up --build
# Frontend: http://localhost:3000  |  API: http://localhost:8000/docs
# Postgres is exposed on localhost:5436 (5432/5433/5434 are already used).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic_rag
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Text Embeddings Inference — serves the Vietnamese BGE-M3 embedding model.
  # OpenAI-compatible at /v1/embeddings (used by EMBEDDING_BASE_URL).
  tei:
    # GPU build built for sm86 (RTX 3060), float16 to keep VRAM small.
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9.2
    gpus: all
    command: >-
      --model-id Adc05102002/bge-m3-vi-base
      --port 80 --pooling cls --dtype float16
      --max-client-batch-size 64
    environment:
      HF_HOME: /data
    ports:
      - "8080:80"
    volumes:
      - tei_data:/data

  minio:
    # minio/minio was removed from Docker Hub; use the locally available
    # Chainguard build. Runs as root so the named volume is writable.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      # 9001 is taken by penpot on this host; console on 9002.
      - "9002:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://agentic:agentic@postgres:5432/agentic_rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Anthropic-compatible proxy. RAG_* names keep the app independent of
      # the host shell's own ANTHROPIC_* variables (e.g. agent tooling).
      ANTHROPIC_BASE_URL: ${RAG_ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${RAG_ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_EXTRA_HEADERS: ${RAG_ANTHROPIC_EXTRA_HEADERS:-{}}
      ANTHROPIC_THINKING_TYPE: ${RAG_ANTHROPIC_THINKING_TYPE:-}
      ANTHROPIC_OUTPUT_EFFORT: ${RAG_ANTHROPIC_OUTPUT_EFFORT:-}
      # Embedding backend: TEI (default) or Ollama bge-m3.
      # Switch with ./control.sh embeddings <tei|ollama>
      EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-Adc05102002/bge-m3-vi-base}
      EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
      EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-http://tei:80/v1}
      QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-chunks_vi}
    # Reach Ollama running on the host (OPENAI_BASE_URL in backend/.env.example)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      tei:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://agentic:agentic@postgres:5432/agentic_rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Must match api: ingestion and query embeddings have to use the same
      # encoder and Qdrant collection.
      EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-Adc05102002/bge-m3-vi-base}
      EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
      EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-http://tei:80/v1}
      QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-chunks_vi}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      tei:
        condition: service_started
    command: rq worker ingestion --url redis://redis:6379/0

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
  qdrant_data:
  minio_data:
  tei_data:
