# Agentic RAG — full local stack (Section 16.4)
#   docker compose up --build
# Web (same-origin via Caddy): http://localhost:8090  |  API: http://localhost:8000/docs
# Postgres is exposed on localhost:5436 (5432/5433/5434 are already used).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic_rag
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Qwen3-Reranker-4B scoring service (transformers + bitsandbytes, 4-bit).
  # llama.cpp's /rerank uses rank pooling and does not score this causal-LM
  # reranker correctly (upstream support is still an open PR), so the
  # official implementation runs in a small FastAPI service.
  reranker:
    build: ./reranker
    gpus: all
    environment:
      MODEL_ID: Qwen/Qwen3-Reranker-4B
      LOAD_IN_4BIT: "true"
      BATCH_SIZE: "4"
      MAX_LENGTH: "4096"
      HF_HOME: /models/hf
    volumes:
      - reranker_cache:/models/hf
    ports:
      - "8083:8000"
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s

  # Text Embeddings Inference — serves the Vietnamese BGE-M3 embedding model.
  # OpenAI-compatible at /v1/embeddings (used by EMBEDDING_BASE_URL).
  # Off by default: Ollama bge-m3 is the default embedding. Enable with
  # `./control.sh embeddings tei` — an explicitly targeted service starts
  # even when it belongs to a profile.
  tei:
    profiles: ["tei"]
    # GPU build built for sm86 (RTX 3060), float16 to keep VRAM small.
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9.2
    gpus: all
    command: >-
      --model-id Adc05102002/bge-m3-vi-base
      --port 80 --pooling cls --dtype float16
      --max-client-batch-size 64
    environment:
      HF_HOME: /data
    ports:
      - "8080:80"
    volumes:
      - tei_data:/data

  minio:
    # minio/minio was removed from Docker Hub; use the locally available
    # Chainguard build. Runs as root so the named volume is writable.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      # 9001 is taken by penpot on this host; console on 9002.
      - "9002:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://agentic:agentic@postgres:5432/agentic_rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      LANGGRAPH_CHECKPOINTING: ${LANGGRAPH_CHECKPOINTING:-false}
      AUTH_BOOTSTRAP_EMAILS: ${AUTH_BOOTSTRAP_EMAILS:-}
      AUTH_BOOTSTRAP_TENANT_ID: ${AUTH_BOOTSTRAP_TENANT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://rag.thuyetmt.io.vn/auth/callback}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      # Anthropic-compatible proxy. RAG_* names keep the app independent of
      # the host shell's own ANTHROPIC_* variables (e.g. agent tooling).
      ANTHROPIC_BASE_URL: ${RAG_ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${RAG_ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_EXTRA_HEADERS: ${RAG_ANTHROPIC_EXTRA_HEADERS:-{}}
      ANTHROPIC_THINKING_TYPE: ${RAG_ANTHROPIC_THINKING_TYPE:-}
      ANTHROPIC_OUTPUT_EFFORT: ${RAG_ANTHROPIC_OUTPUT_EFFORT:-}
      # Embedding backend: qwen3-embedding:8b (default, accuracy-first),
      # Ollama bge-m3, or TEI. Switch with ./control.sh embeddings <qwen3|ollama|tei>
      EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:8b}
      EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-4096}
      EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      # Query-only instruction. `-` (not `:-`) keeps an explicit empty value
      # for models that do not use one (bge-m3/TEI).
      EMBEDDING_QUERY_INSTRUCTION: "${RAG_EMBEDDING_QUERY_INSTRUCTION-Given a Vietnamese question, retrieve passages that answer the question}"
      QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-chunks_qwen3_8b}
      # Reranker (transformers service). Disable with RAG_RERANK_ENABLED=false.
      RERANK_ENABLED: ${RAG_RERANK_ENABLED:-true}
      RERANK_URL: ${RAG_RERANK_URL:-http://reranker:8000}
      RERANK_PATH: ${RAG_RERANK_PATH:-/rerank}
      RERANK_MODEL: ${RAG_RERANK_MODEL:-Qwen3-Reranker-4B}
      RERANK_CANDIDATES: ${RAG_RERANK_CANDIDATES:-50}
      RERANK_TOP_N: ${RAG_RERANK_TOP_N:-10}
    # Reach Ollama running on the host (OPENAI_BASE_URL in backend/.env.example)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    # Docling runs on the GPU when available; ingestion is async, so it can
    # share the RTX 3060 with the reranker (watch VRAM under load).
    gpus: all
    build:
      context: ./backend
      args:
        # RAG_DOCLING_ENABLED=true rebuilds the worker with Docling for
        # scientific/layout-heavy PDFs. The api image stays small.
        INSTALL_DOCLING: ${RAG_DOCLING_ENABLED:-false}
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://agentic:agentic@postgres:5432/agentic_rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Must match api: ingestion and query embeddings have to use the same
      # encoder and Qdrant collection.
      EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:8b}
      EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-4096}
      EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_QUERY_INSTRUCTION: "${RAG_EMBEDDING_QUERY_INSTRUCTION-Given a Vietnamese question, retrieve passages that answer the question}"
      QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-chunks_qwen3_8b}
      # Optional scientific-PDF parser (only present when built with Docling).
      DOCLING_DEVICE: ${RAG_DOCLING_DEVICE:-auto}
      DOCLING_OCR: "false"
      HF_HOME: /models/hf
    volumes:
      - docling_cache:/models/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: rq worker ingestion --url redis://redis:6379/0

  # Same-origin entry point for the public tunnel (and local :8090).
  proxy:
    image: caddy:2-alpine
    ports:
      - "8090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - frontend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_OAUTH_ENABLED: ${RAG_OAUTH_ENABLED:-false}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  qdrant_data:
  minio_data:
  tei_data:
  reranker_cache:
  docling_cache:
